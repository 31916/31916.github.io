name: Deploy static website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build current and legacy URLs
        run: |
          python3 tools/build-pages.py "$RUNNER_TEMP/pages.tar"
          mkdir "$RUNNER_TEMP/site"
          tar -xf "$RUNNER_TEMP/pages.tar" -C "$RUNNER_TEMP/site"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import runpy
          builder = runpy.run_path("tools/build-pages.py")
          site = Path(os.environ["RUNNER_TEMP"]) / "site"
          for name in builder["PUBLIC"]:
              if name.endswith(".html"):
                  expected = builder["render_public_html"](Path(name).read_bytes())
                  assert (site / name).read_bytes() == expected, name
          PY
          cd "$RUNNER_TEMP/site/IMELayoutRouter/downloads"
          sha256sum -c SHA256SUMS.txt
          cd "$RUNNER_TEMP/site/IMELayOutRouter/downloads"
          sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
