        <button class="satellite" data-section="posts" aria-haspopup="dialog" aria-label="投稿を開く">

        <button class="satellite" data-section="resume" aria-haspopup="dialog" aria-label="履歴書を開く">
          <span class="satellite-label"><span class="satellite-number" aria-hidden="true" data-no-translate>03</span><span>履歴書</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 12 12 4M4 4h8v8" /></svg></span>

          <span class="satellite-label"><span class="satellite-number" aria-hidden="true" data-no-translate>04</span><span>趣味</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 12 12 4M4 4h8v8" /></svg></span>
        </button>

      <p id="render-status" class="render-status" role="status" data-i18n-dynamic></p>

    <dialog class="content-panel" aria-labelledby="panel-title">
      <header class="panel-header">
        <div><h2 id="panel-title"></h2></div>
        <div class="panel-controls">

        </div>

      <div id="intro-copy" class="panel-introduction" hidden>
